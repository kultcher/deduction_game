name: Overwrite Latest Archive on Google Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drive-latest-backup
  cancel-in-progress: false

jobs:
  backup-to-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Archive tracked repository files
        shell: bash
        run: git archive --format=zip --output="$RUNNER_TEMP/latest-repo-archive.zip" HEAD

      - name: Authenticate as the My Drive owner
        id: auth
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLIENT_ID:?GDRIVE_CLIENT_ID is empty}"
          : "${CLIENT_SECRET:?GDRIVE_CLIENT_SECRET is empty}"
          : "${REFRESH_TOKEN:?GDRIVE_REFRESH_TOKEN is empty}"
          curl --fail-with-body --silent --show-error \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token' \
            'https://oauth2.googleapis.com/token' > "$RUNNER_TEMP/drive-token.json"
          TOKEN=$(jq -er '.access_token | select(type == "string" and length > 0)' "$RUNNER_TEMP/drive-token.json")
          echo "::add-mask::$TOKEN"
          printf 'access_token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/drive-token.json"

      - name: Create or overwrite the latest backup
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          : "${ACCESS_TOKEN:?No access token was generated}"
          : "${FOLDER_ID:?GDRIVE_FOLDER_ID is empty}"
          [[ "$FOLDER_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo 'Use only the folder ID, not its full URL'; exit 1; }
          FILENAME='latest-backup.zip'
          ARCHIVE="$RUNNER_TEMP/latest-repo-archive.zip"
          RESPONSE="$RUNNER_TEMP/drive-response.json"

          echo 'Checking for an existing backup...'
          curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q='$FOLDER_ID' in parents and name='$FILENAME' and trashed=false" \
            --data-urlencode 'fields=files(id,name),nextPageToken' \
            --data-urlencode 'pageSize=100' \
            --data-urlencode 'supportsAllDrives=true' \
            --data-urlencode 'includeItemsFromAllDrives=true' \
            'https://www.googleapis.com/drive/v3/files' > "$RESPONSE"
          jq -e '.files | type == "array"' "$RESPONSE" > /dev/null
          COUNT=$(jq '.files | length' "$RESPONSE")
          if (( COUNT > 1 )); then
            echo 'Multiple latest-backup.zip files exist. Remove duplicates before retrying.'
            exit 1
          fi
          FILE_ID=$(jq -r '.files[0].id // empty' "$RESPONSE")

          if [[ -n "$FILE_ID" ]]; then
            echo 'Overwriting the existing backup...'
            curl --fail-with-body --silent --show-error -X PATCH \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H 'Content-Type: application/zip' \
              --data-binary "@$ARCHIVE" \
              "https://www.googleapis.com/upload/drive/v3/files/$FILE_ID?uploadType=media&supportsAllDrives=true&fields=id,name,size" > "$RESPONSE"
          else
            echo 'Creating the first backup...'
            jq -n --arg name "$FILENAME" --arg folder "$FOLDER_ID" \
              '{name:$name,parents:[$folder]}' > "$RUNNER_TEMP/drive-metadata.json"
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H 'Content-Type: application/json; charset=UTF-8' \
              -H 'X-Upload-Content-Type: application/zip' \
              --data-binary "@$RUNNER_TEMP/drive-metadata.json" \
              --dump-header "$RUNNER_TEMP/drive-upload.headers" \
              'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true&fields=id,name,size' > "$RESPONSE"
            UPLOAD_URL=$(sed -n 's/^[Ll]ocation: *//p' "$RUNNER_TEMP/drive-upload.headers" | tr -d '\r')
            : "${UPLOAD_URL:?Drive did not return an upload session URL}"
            curl --fail-with-body --silent --show-error -X PUT \
              -H 'Content-Type: application/zip' \
              --upload-file "$ARCHIVE" "$UPLOAD_URL" > "$RESPONSE"
          fi
          jq -e '.id | type == "string" and length > 0' "$RESPONSE" > /dev/null
          echo 'Backup complete.'
